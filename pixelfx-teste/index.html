<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Teste pixelfx</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#10142a;--fg:#e9ecf6;--mut:#9aa3c0;--acc:#ffc93a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);margin:0;font:14px system-ui,sans-serif}
.wrap{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
h1{font-size:17px;margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{background:#1c2442;color:var(--fg);border:1px solid #2f3a64;border-radius:8px;padding:8px 12px;font:600 14px system-ui;cursor:pointer}
button.on{background:var(--acc);color:#1b1404;border-color:var(--acc)}
#again{background:#e8572c;border-color:#e8572c;color:#fff}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.views>div{min-width:0}
.views h2{font-size:13px;color:var(--mut);margin:0 0 4px;font-weight:600}
#c3{width:100%;aspect-ratio:16/10;display:block;border-radius:8px}
#c2{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated;border-radius:8px}
#info{font:12px ui-monospace,monospace;color:var(--mut)}
small{color:var(--mut)}
@media (max-width:700px){.views{grid-template-columns:1fr}}
</style>
<div class="wrap">
<h1>Teste pixelfx (MIT, patch-gg/pixelfx 0.3.0)</h1>
<div class="row" id="fxs"></div><div class="row"><button id="again">Disparar de novo</button></div>
<div class="views"><div><h2>Jogo 3D low-poly (three r186, sprite com NearestFilter)</h2><canvas id="c3"></canvas></div>
<div><h2>Jogo 2D pixel art (canvas 320x180 ampliado)</h2><canvas id="c2" width="320" height="180"></canvas></div></div>
<div id="info">medindo...</div>
<small>Toque numa das cenas para repetir. Efeitos: coin-collect, collect-burst, chest-open e crit-number, sem mudar nada do original.</small>
</div>

const FX = { coin: ['Moeda coletada', PX.coin], burst: ['Brilho de coleta', PX.burst], chest: ['Baú abrindo', PX.chest], crit: ['Número crítico', PX.crit] };
// ---- frame de pixels compartilhado: 192x128 px do efeito
const FW = 256, FH = 128;
const frame = PX.createFrame(FW, FH);
const img = new ImageData(FW, FH);
const fxCanvas = document.createElement('canvas'); fxCanvas.width = FW; fxCanvas.height = FH;
const fxCtx = fxCanvas.getContext('2d');
let fx = null;
function fire(k) { const m = FX[k][1]; fx = PX.createFx(m, { x: FW / 2, y: FH - 16 }); cur = k; }
let cur = 'coin';
// ---- 3D: three r186 modo "igual ao jogo"
const c3 = document.getElementById('c3');
const r = new THREE.WebGLRenderer({ canvas: c3, antialias: true });
r.outputColorSpace = THREE.LinearSRGBColorSpace; r.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87b7d9);
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 50); cam.position.set(0, 2.2, 5); cam.lookAt(0, 0.8, 0);
scene.add(new THREE.HemisphereLight(0xf2f8ff, 0x9bb866, 0.85 * Math.PI));
const dl = new THREE.DirectionalLight(0xfff3da, 0.7 * Math.PI); dl.position.set(3, 5, 2); scene.add(dl);
const g = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.2, 0.4, 7), new THREE.MeshLambertMaterial({ color: 0x6aa84f })); g.position.y = -0.2; scene.add(g);
const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 10), new THREE.MeshLambertMaterial({ color: 0xf5c542 })); coin.rotation.x = Math.PI / 2; coin.position.y = 0.6; scene.add(coin);
const tex = new THREE.CanvasTexture(fxCanvas); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false; tex.colorSpace = THREE.NoColorSpace;
const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
spr.scale.set(3 * FW / FH, 3, 1); spr.center.set(0.5, 16 / FH); spr.position.set(0, 0.25, 0.3); scene.add(spr);
// ---- 2D: canvas de 320x180 em pixel art, ampliado com image-rendering: pixelated
const c2 = document.getElementById('c2'); const x2 = c2.getContext('2d'); x2.imageSmoothingEnabled = false;
function draw2D() {
  x2.fillStyle = '#2b2440'; x2.fillRect(0, 0, 320, 180);
  x2.fillStyle = '#3b6b3a'; x2.fillRect(0, 150, 320, 30); x2.fillStyle = '#58944f'; x2.fillRect(0, 150, 320, 4);
  x2.fillStyle = '#e9d28a'; x2.fillRect(70, 126, 12, 24); x2.fillStyle = '#c03b3b'; x2.fillRect(70, 120, 12, 8); // personagem
  x2.drawImage(fxCanvas, 160 - FW / 2, 154 - FH + 16 - 16);
}
// ---- UI
const bar = document.getElementById('fxs');
for (const k in FX) { const b = document.createElement('button'); b.textContent = FX[k][0]; b.onclick = () => { fire(k); [...bar.children].forEach((x) => x.classList.toggle('on', x === b)); }; bar.appendChild(b); }
bar.children[0].classList.add('on');
document.getElementById('again').onclick = () => fire(cur);
[c3, c2].forEach((c) => c.addEventListener('pointerup', () => fire(cur)));
function resize() { const w = c3.clientWidth, h = c3.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const info = document.getElementById('info'); let acc = 0, n = 0, worst = 0, statT = 0, last = performance.now();
r.setAnimationLoop((t) => {
  const dt = Math.min((t - last) / 1000, 0.1); last = t;
  const t0 = performance.now();
  PX.clearFrame(frame);
  if (fx) { fx.update(dt); fx.draw(frame); if (fx.done()) fx = null; }
  PX.composite(frame, img.data, null); fxCtx.putImageData(img, 0, 0); tex.needsUpdate = true;
  const ms = performance.now() - t0; acc += ms; n++; worst = Math.max(worst, ms);
  coin.rotation.z += dt * 2;
  r.render(scene, cam); draw2D();
  statT += dt; if (statT > 1) { info.textContent = `pixelfx por quadro (simular + compor + subir textura): média ${(acc / n).toFixed(2)} ms · pior ${worst.toFixed(2)} ms`; statT = 0; acc = 0; n = 0; worst = 0; }
});
fire('coin');
window.__px = { fire };
</script></body></html>
