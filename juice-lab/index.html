<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Laboratório de Juice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0f1424;--panel:#182038;--fg:#e9ecf6;--mut:#9aa3c0;--acc:#ffc93a;--on:#2f6b46;color-scheme:dark}
body{background:var(--bg);color:var(--fg);margin:0;font:14px system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px))}
header h1{font-size:16px;margin:0 8px 0 0}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
button{background:var(--panel);color:var(--fg);border:1px solid #2c3658;border-radius:8px;padding:8px 12px;font:600 14px system-ui;cursor:pointer}
button.on{background:var(--acc);color:#1b1404;border-color:var(--acc)}
#go{background:#e8572c;border-color:#e8572c;color:#fff;font-size:16px;padding:10px 18px}
main{flex:1;display:flex;min-height:0}
#wrap{position:relative;flex:1;min-width:0}
#c{width:100%;height:100%;display:block;touch-action:manipulation}
#fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fl div{font:900 34px system-ui!important;color:#ffd84a!important;-webkit-text-stroke:2px #2b1600}
aside{width:290px;background:var(--panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;background:#11182c;cursor:pointer;user-select:none}
.step.on{background:var(--on)}
.step input{width:18px;height:18px}
kbd{font:600 12px ui-monospace,monospace;background:#0008;border-radius:4px;padding:1px 5px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap}
#info{font:12px ui-monospace,monospace;color:var(--mut)}
small{color:var(--mut);line-height:1.4}
@media (max-width:760px){main{flex-direction:column}#wrap{flex:none;height:52dvh}aside{width:auto}}
</style>
<div id="app">
<header><h1>Laboratório de Juice</h1><div id="tabs"></div><button id="go">Disparar (espaço)</button></header>
<main><div id="wrap"><canvas id="c"></canvas><div id="fl"></div></div>
<aside><div class="row"><button id="all">Tudo</button><button id="none">Nenhum</button><label class="step"><input id="rm" type="checkbox"><span>Reduzir movimento</span></label></div>
<div id="steps"></div>
<small>Liga e desliga cada passo (teclas 1-0) e dispara de novo para comparar. No feitiço, com "Crítico" ligado, cada 3º lançamento é crítico. Sons são provisórios. Referências: vasilev.yegor (baú), bannerfront (espada), theabilityforge (feitiço).</small>
<div id="info">medindo...</div></aside></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<script>
/* juice.js - modulo de "juice" sem dependencias, para colar num HTML unico (Three.js r128) ou usar via Node/<script>.

<script type="module">
import * as THREE from 'three';
// Laboratório de juice: baú (7 passos), golpe de espada (7 passos), feitiço de terra (10 níveis).

THREE.ColorManagement.enabled = false;

// ------------------------------------------------------------------ juice (módulo da skill game-juice)
const settings = J.createSettings({ window });

// pools de partículas -> InstancedMesh (zero alocação por quadro)
const dummy = new THREE.Object3D();
function makePool(max, geo, mat, gravity, drag, seed) {
  const pool = J.createParticlePool(max, seed);

  const mesh = new THREE.InstancedMesh(geo, mat, max); mesh.count = 0; mesh.frustumCulled = false; scene.add(mesh);

}
const P = {
  spark: makePool(160, new THREE.BoxGeometry(0.05, 0.05, 0.05), add(0xffd25a), 6, 1.5, 3),
  dust: makePool(160, new THREE.IcosahedronGeometry(0.12, 0), lam(0x9a8f88, { transparent: true, opacity: 0.85 }), -0.4, 2.5, 5),
  rock: makePool(120, new THREE.BoxGeometry(0.12, 0.1, 0.12), lam(0x6d5640), 14, 0.2, 7),
  blood: makePool(80, new THREE.BoxGeometry(0.06, 0.06, 0.06), lam(0x9a1020), 12, 0.5, 9),

function burst(k, x, y, z, n, speed, life, up, size) {
  const e = settings.eff();
  P[k].pool.emitBurst(x, y, z, Math.max(1, Math.round(n * e.particles)), speed, life, up, size);
}
function updatePools(dt) {
  for (const k in P) {
    const { pool, mesh } = P[k];
    pool.update(dt);
    J.writeInstanced(pool, mesh, dummy, 1);
    mesh.instanceMatrix.needsUpdate = true;
  }
}

// estrelas que "estouram como bolha" e destroços que ficam: slots fixos
const STAR_N = 10;
const starGeo = (() => { // estrela de 5 pontas achatada
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.45 : 1, a = i / 10 * PI * 2 + PI / 2; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); }

})();
const stars = [];
for (let i = 0; i < STAR_N; i++) {
  const m = new THREE.Mesh(starGeo, add(0xfff0a0)); m.visible = false; scene.add(m);
  stars.push({ m, t: 0, life: 0, vx: 0, vy: 0, vz: 0 });
}
const RUBBLE_N = 60;
const rubble = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.11, 0), lam(0x5b4836), RUBBLE_N);
rubble.count = 0; rubble.castShadow = true; scene.add(rubble);
function addRubble(x, z, n, spread) {
  for (let i = 0; i < n && rubble.count < RUBBLE_N; i++) {
    const s = 0.6 + Math.random() * 0.9;
    dummy.position.set(x + (Math.random() - 0.5) * spread, 0.05 * s, z + (Math.random() - 0.5) * spread);
    dummy.rotation.set(Math.random() * 3, Math.random() * 3, 0); dummy.scale.set(s, s * 0.7, s); dummy.updateMatrix();
    rubble.setMatrixAt(rubble.count++, dummy.matrix);
  }
  rubble.instanceMatrix.needsUpdate = true;
  dummy.rotation.set(0, 0, 0);

// ------------------------------------------------------------------ áudio (placeholders sintetizados; grave e curto)
let AC = null;
function ac() { if (!AC) { try { AC = new AudioContext(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }

}

  thump() { const c = ac(); if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.18); env(c, g, t, 0.005, 0.5, 0.22); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.3); },
  clang() {
    const c = ac(); if (!c) return; const t = c.currentTime, out = c.createGain(); out.gain.value = 0.18; out.connect(c.destination);
    for (const f of [520, 1310, 1975, 2780]) { const o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = f; env(c, g, t, 0.002, 0.6, 0.25 + 220 / f); o.connect(g).connect(out); o.start(t); o.stop(t + 0.6); }
    const n = c.createBufferSource(), ng = c.createGain(), hp = c.createBiquadFilter(); n.buffer = noise(c); hp.type = 'highpass'; hp.frequency.value = 2500; env(c, ng, t, 0.001, 0.5, 0.05); n.connect(hp).connect(ng).connect(out); n.start(t); n.stop(t + 0.1);
  },
  rumble(dur) { const c = ac(); if (!c) return; const t = c.currentTime, n = c.createBufferSource(), lp = c.createBiquadFilter(), g = c.createGain(); n.buffer = noise(c); n.loop = true; lp.type = 'lowpass'; lp.frequency.value = 160; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); n.connect(lp).connect(g).connect(c.destination); n.start(t); n.stop(t + dur + 0.05); },
  crunch(big) { const c = ac(); if (!c) return; const t = c.currentTime, n = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); n.buffer = noise(c); bp.type = 'bandpass'; bp.frequency.value = big ? 300 : 450; bp.Q.value = 0.8; env(c, g, t, 0.003, big ? 1 : 0.7, big ? 0.45 : 0.25); n.connect(bp).connect(g).connect(c.destination); n.start(t); n.stop(t + 0.6); SFX.thump(); },

// ------------------------------------------------------------------ agenda em tempo de SIMULAÇÃO (congela no hit-stop)
const agenda = []; // {t, fn}
let simNow = 0;
function at(delay, fn) { agenda.push({ t: simNow + delay, fn }); }
function runAgenda() { for (let i = agenda.length - 1; i >= 0; i--) if (agenda[i].t <= simNow) { const f = agenda[i].fn; agenda.splice(i, 1); f(); } }
const anims = []; // {t0, dur, fn(u)} em tempo de simulação
function anim(dur, fn, delay) { anims.push({ t0: simNow + (delay || 0), dur, fn }); }
function runAnims() {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; if (simNow < a.t0) continue;
    const u = Math.min(1, (simNow - a.t0) / a.dur); a.fn(u); if (u >= 1) anims.splice(i, 1);
  }
}
const E = J.ease;
function hitStop(s) { clock.hitStop(s * settings.eff().hitStop); }
function addShake(a) { shake.add(a * settings.eff().shake); }
function toScreen(v) { // posição 3D -> px no container
  v.project(camera);
  return { x: (v.x * 0.5 + 0.5) * W, y: (-v.y * 0.5 + 0.5) * H };
}

// barra de vida (planos, sem DOM)
function makeBar(parent, y) {
  const g = new THREE.Group(); scene.add(g); const off = y;
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.12), new THREE.MeshBasicMaterial({ color: 0x111111 })); g.add(bg);
  const lag = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff })); lag.position.z = 0.001; g.add(lag);
  const fg = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.1), new THREE.MeshBasicMaterial({ color: 0x37d35a })); fg.position.z = 0.002; g.add(fg);
  const bar = { g, fg, lag, v: 1, lagV: 1 };
  bar.set = (v) => { bar.v = v; };
  bar.update = (dt) => {
    bar.lagV += (bar.v - bar.lagV) * (1 - Math.exp(-4 * dt));
    for (const [m, val] of [[bar.fg, bar.v], [bar.lag, bar.lagV]]) { m.scale.x = Math.max(0.0001, val); m.position.x = -(1 - val) / 2; }
    g.position.set(parent.position.x, parent.position.y + off, parent.position.z); g.quaternion.copy(camera.quaternion);
  };
  return bar;
}

// ------------------------------------------------------------------ CENA 1: BAÚ
const chest = (() => {

  return { root, body, lidPivot, gold, goldM, lock, light, rays, rayMat, ring, ringMat, open: false, dustOn: false, wob: 0, sq: J.createSquash(260, 9) };
})();
const CHEST_STEPS = ['Tremer + achatar', 'Esticar (mola)', 'Batida (congela + câmera)', 'Luz de dentro + raios', 'Onda de choque', 'Estrelas que estouram', 'Poeira mágica subindo'];
function chestReset() {
  chest.lidPivot.rotation.x = 0; chest.open = false; chest.dustOn = false; chest.wob = 0;
  chest.light.intensity = 0; chest.rayMat.opacity = 0; chest.ringMat.opacity = 0; chest.goldM.emissive.setScalar(0);
  chest.body.rotation.set(0, 0, 0); chest.sq.spring.x = 0; chest.sq.spring.v = 0;
}
function chestPlay(on) {
  chestReset();
  let t = 0;
  if (on[0]) { // tremer cada vez mais rápido e achatar
    chest.wob = 1; at(0.7, () => { chest.wob = 0; chest.body.rotation.z = 0; chest.sq.kick(-4 * settings.eff().squash); });
    t = 0.82;
  }
  at(t, () => {
    if (on[1]) chest.sq.kick(7 * settings.eff().squash);
    if (on[2]) { // batida: abre em 0,07 s, congela, treme a câmera
      anim(0.07, (u) => { chest.lidPivot.rotation.x = -1.95 * E.outCubic(u); });
      at(0.07, () => { hitStop(0.09); addShake(0.45); SFX.thump(); anim(0.25, (u) => { chest.lidPivot.rotation.x = -1.95 + 0.15 * Math.sin(u * PI) ; }); });
    } else anim(0.6, (u) => { chest.lidPivot.rotation.x = -1.95 * E.inOutCubic(u); });
    const tOpen = on[2] ? 0.07 : 0.6;
    at(tOpen, () => {

      if (on[3]) { anim(0.35, (u) => { chest.light.intensity = 1.2 * PI * u; chest.rayMat.opacity = 0.22 * u; chest.goldM.emissive.setRGB(0.22 * u, 0.15 * u, 0); }); SFX.chime(); }

}
function launchStars(x, y, z) {
  const n = Math.max(3, Math.round(STAR_N * settings.eff().particles));
  for (let i = 0; i < n; i++) {
    const s = stars[i], a = (i / n) * PI * 2;
    s.m.visible = true; s.m.position.set(x, y, z); s.t = 0; s.life = 0.7 + Math.random() * 0.35;
    s.vx = Math.cos(a) * (1.2 + Math.random()); s.vz = Math.sin(a) * 0.5; s.vy = 2.5 + Math.random() * 1.5;
  }
}
function updateStars(dt) {
  for (const s of stars) {
    if (!s.m.visible) continue;
    s.t += dt; s.vy -= 3 * dt;
    s.m.position.x += s.vx * dt; s.m.position.y += s.vy * dt; s.m.position.z += s.vz * dt;
    const u = s.t / s.life;

    s.m.quaternion.copy(camera.quaternion);

}
let dustAcc = 0;
function chestSim(dt) {
  if (chest.wob) { chest.wob += dt; const w = chest.wob; chest.body.rotation.z = Math.sin(w * w * 60) * 0.07 * Math.min(1, w * 2) * settings.eff().squash; }
  chest.sq.update(dt); chest.body.scale.set(chest.sq.sx, chest.sq.sy, chest.sq.sz);
  if (chest.open && chest.rayMat.opacity > 0) chest.rays.rotation.y += dt * 0.5;
  if (chest.dustOn) { dustAcc += dt * 24; while (dustAcc >= 1) { dustAcc--; burst('magic', (Math.random() - 0.5) * 1.0, 0.75, (Math.random() - 0.5) * 0.5, 1, 0.25, 1.6, 0.5, 1); } }
}

// ------------------------------------------------------------------ CENA 2: GOLPE DE ESPADA
const sw = (() => {
  const hero = dummyMan(0x5d8ad6, -1.1), foe = dummyMan(0x8a6f5c, 1.0);
  const sword = box(0.08, 0.9, 0.08, lam(0xd0d6e2), 0.45, 1.3, 0.1, hero.g); sword.rotation.z = -0.6;
  const bar = makeBar(foe.g, 2.05);
  const splatMat = new THREE.MeshLambertMaterial({ color: 0x7a0c18, transparent: true, opacity: 0.85 });
  const splat = new THREE.Mesh(new THREE.CircleGeometry(0.5, 20), splatMat); splat.rotation.x = -PI / 2; splat.position.set(1.0, 0.01, 0.1); splat.scale.setScalar(0.001); scene.add(splat);
  return { hero, foe, sword, bar, splat, hp: 100, flashT: 0, kb: 0, dead: false };
})();
const SWORD_STEPS = ['Inimigo pisca branco', 'Som de "clang"', 'Faíscas no impacto', 'Barra de vida', 'Empurrão (knockback)', 'Sangue conforme a vida cai', 'Animação de morte'];
function swordReset() { sw.hp = 100; sw.dead = false; sw.foe.g.rotation.z = 0; sw.foe.g.position.set(1.0, 0, 0); sw.bar.set(1); sw.bar.lagV = 1; sw.splat.scale.setScalar(0.001); sw.foe.mat.color.copy(sw.foe.base); }
function swordPlay(on) {
  if (sw.dead) swordReset();
  sw.bar.g.visible = !!on[3];
  anim(0.12, (u) => { sw.hero.g.position.x = -1.1 + 0.55 * E.outCubic(u); sw.sword.rotation.z = -0.6 - 1.6 * E.outCubic(u); });
  anim(0.25, (u) => { sw.hero.g.position.x = -0.55 - 0.55 * E.inOutCubic(u); sw.sword.rotation.z = -2.2 + 1.6 * u; }, 0.12);
  at(0.12, () => {
    sw.hp = Math.max(0, sw.hp - 25); sw.bar.set(sw.hp / 100);
    if (on[0]) sw.flashT = 0.09;
    if (on[1]) SFX.clang();
    if (on[2]) burst('spark', 0.75, 1.1, 0.2, 18, 4, 0.35, 1.5, 1);
    if (on[4]) { sw.kb = 1; anim(0.18, (u) => { sw.foe.g.position.x = 1.0 + 0.5 * E.outCubic(u); }); anim(0.5, (u) => { sw.foe.g.position.x = 1.5 - 0.5 * E.inOutCubic(u); }, 0.3); }
    if (on[5]) { const lost = 1 - sw.hp / 100; burst('blood', 0.85, 1.0, 0.1, 6 + Math.round(10 * lost), 2.5, 0.6, 1, 1); anim(0.3, (u) => { sw.splat.scale.setScalar(0.001 + lost * 1.1 * E.outCubic(u) + (lost - 0.25) * 1.1 * (1 - E.outCubic(u))); }); }
    if (sw.hp <= 0) {
      if (on[6]) { at(0.15, () => { anim(0.45, (u) => { sw.foe.g.rotation.z = -PI / 2 * E.outBounce(u); }); SFX.thump(); addShake(0.25); burst('dust', 1.6, 0.1, 0, 10, 1.5, 0.6, 0.6, 1); }); }
      sw.dead = true; at(1.8, () => { if (sw.dead) swordReset(); });
    }
  });
}
function swordSim(dt) {
  if (sw.flashT > 0) { sw.flashT -= dt; sw.foe.mat.color.setRGB(3, 3, 3); if (sw.flashT <= 0) sw.foe.mat.color.copy(sw.foe.base); }
}

// ------------------------------------------------------------------ CENA 3: FEITIÇO DE TERRA
const sp = (() => {
  const caster = dummyMan(0x6b9c5a, -2.6), foe = dummyMan(0x8a6f5c, 2.4);
  const bar = makeBar(foe.g, 2.05);
  const stone = lam(0x7a6650);
  const pillars = [];
  for (let i = 0; i < 6; i++) { const m = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.6, 6), stone); m.castShadow = true; m.visible = false; scene.add(m); pillars.push(m); }
  const crackMat = new THREE.MeshBasicMaterial({ color: 0x1a120c });
  const crack = new THREE.InstancedMesh(new THREE.BoxGeometry(0.16, 0.02, 0.07), crackMat, 40); crack.count = 0; scene.add(crack);
  const stunStars = []; for (let i = 0; i < 3; i++) { const m = new THREE.Mesh(starGeo, add(0xffe27a)); m.scale.setScalar(0.1); m.visible = false; foe.g.add(m); stunStars.push(m); }
  return { caster, foe, bar, pillars, crack, stunStars, casts: 0, stun: 0, vy: 0, air: false };
})();
const SPELL_STEPS = ['Lançamento básico (só dano)', 'Pilar de pedra', 'Rachadura correndo', 'Ronco + tremor de tela', 'Números de dano + congelar', 'Lançar no ar + atordoar', 'Explosão de pedra e poeira', 'Entulho fica, pilar desmorona', 'Trilha de pilares', 'Crítico'];
const crackPts = []; { let x = -2.2, z = 0; for (let i = 0; i < 40; i++) { x += 0.115; z += (Math.random() - 0.5) * 0.12; z *= 0.9; crackPts.push([x, z, (Math.random() - 0.5) * 0.9]); } }
function spellReset() { sp.crack.count = 0; rubble.count = 0; rubble.instanceMatrix.needsUpdate = true; sp.pillars.forEach((p) => (p.visible = false)); sp.foe.g.position.set(2.4, 0, 0); sp.stun = 0; sp.air = false; }
function spellPlay(on) {
  spellReset(); sp.casts++;
  const crit = on[9] && sp.casts % 3 === 0; // a cada 3 lançamentos, crítico
  sp.bar.set(1); sp.bar.lagV = 1;
  anim(0.2, (u) => { sp.caster.arm.rotation.z = -2.2 * Math.sin(u * PI); sp.caster.arm.position.y = 1.0 + 0.2 * Math.sin(u * PI); });

      for (let i = sp.crack.count; i < n; i++) { const c = crackPts[i]; dummy.position.set(c[0], 0.012, c[1]); dummy.rotation.set(0, c[2], 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); sp.crack.setMatrixAt(i, dummy.matrix); }
      sp.crack.count = n; sp.crack.instanceMatrix.needsUpdate = true; dummy.rotation.set(0, 0, 0);
    }, 0.2);
    if (on[3]) at(0.2, () => SFX.rumble(dur + 0.3));
    if (on[8]) { // trilha de pilares ao longo da rachadura
      for (let i = 1; i <= 4; i++) at(0.2 + dur * i / 5, () => raisePillar(i, -2.2 + i * 0.92, 0, 0.55, on));
    }

    const dmg = crit ? 85 : 15;
    sp.bar.set(1 - dmg / 100);
    if (on[1]) raisePillar(0, 2.4, 0, crit ? 1.5 : 1, on);
    if (on[3]) { SFX.crunch(crit); addShake(crit ? 0.8 : 0.45); }
    if (on[4]) { hitStop(crit ? 0.14 : 0.09); floatNum(2.4, 2.4, 0, dmg, crit ? 1 : 0); }

    if (crit) { burst('dust', 0, 0.2, 0, 26, 3.5, 0.9, 0.6, 1.3); burst('rock', 0.5, 0.2, 0, 24, 5, 1, 3, 1); }

}
function raisePillar(i, x, z, scale, on) {
  const p = sp.pillars[i]; p.visible = true; p.position.set(x, 0, z); p.scale.set(scale, 0.001, scale);

}
function spellSim(dt) {
  if (sp.air) { sp.vy -= 18 * dt; sp.foe.g.position.y += sp.vy * dt; if (sp.foe.g.position.y <= 0) { sp.foe.g.position.y = 0; sp.air = false; burst('dust', 2.4, 0.1, 0, 8, 1.2, 0.5, 0.4, 1); } }
  sp.foe.g.rotation.z = sp.air ? Math.sin(simNow * 12) * 0.25 : 0;
  if (sp.stun > 0) { sp.stun -= dt; }
  sp.stunStars.forEach((m, i) => { m.visible = sp.stun > 0; const a = simNow * 5 + i * 2.09; m.position.set(Math.cos(a) * 0.35, 1.9, Math.sin(a) * 0.35); m.quaternion.copy(camera.quaternion); });
}

// ------------------------------------------------------------------ cenas, UI e loop
const SCENES = {
  bau: { title: 'Baú', steps: CHEST_STEPS, play: chestPlay, show: [chest.root], cam: [0, 3.2, 6.2, 0, 0.6, 0] },
  golpe: { title: 'Golpe de espada', steps: SWORD_STEPS, play: swordPlay, show: [sw.hero.g, sw.foe.g, sw.splat, sw.bar.g], cam: [0, 3.2, 6.6, 0, 0.9, 0] },
  feitico: { title: 'Feitiço de terra', steps: SPELL_STEPS, play: spellPlay, show: [sp.caster.g, sp.foe.g, sp.crack, ...sp.pillars, rubble, sp.bar.g], cam: [0, 5.5, 9, 0, 0.6, 0] },
};
const state = { cur: 'bau', on: { bau: CHEST_STEPS.map(() => true), golpe: SWORD_STEPS.map(() => true), feitico: SPELL_STEPS.map(() => true) } };

const panel = document.getElementById('steps'), tabs = document.getElementById('tabs');
function setScene(k) {
  state.cur = k; agenda.length = 0; anims.length = 0;
  allSceneObjs.forEach((o) => (o.visible = false));
  SCENES[k].show.forEach((o) => { if (!sp.pillars.includes(o)) o.visible = true; });
  for (const p of Object.values(P)) p.pool.clear();
  stars.forEach((s) => (s.m.visible = false));
  chestReset(); swordReset(); spellReset();
  const c = SCENES[k].cam; camBase.x = c[0]; camBase.y = c[1]; camBase.z = c[2];
  camera.position.set(c[0], c[1], c[2]); camera.lookAt(c[3], c[4], c[5]); camBase.rz = camera.rotation.z;
  [...tabs.children].forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  drawSteps();
}
function drawSteps() {
  const s = SCENES[state.cur], on = state.on[state.cur];
  panel.innerHTML = '';
  s.steps.forEach((name, i) => {
    const l = document.createElement('label'); l.className = 'step' + (on[i] ? ' on' : '');
    const key = (i + 1) % 10;
    l.innerHTML = `<input type="checkbox" ${on[i] ? 'checked' : ''}><kbd>${key}</kbd><span>${name}</span>`;
    if (state.cur === 'feitico' && i === 0) { l.querySelector('input').disabled = true; }
    l.querySelector('input').onchange = (e) => { on[i] = e.target.checked; l.classList.toggle('on', on[i]); };
    panel.appendChild(l);
  });
}
function setAll(v) { const on = state.on[state.cur]; for (let i = 0; i < on.length; i++) on[i] = v || (state.cur === 'feitico' && i === 0); drawSteps(); }
function fire() { ac(); SCENES[state.cur].play(state.on[state.cur]); }
for (const k in SCENES) { const b = document.createElement('button'); b.textContent = SCENES[k].title; b.dataset.k = k; b.onclick = () => setScene(k); tabs.appendChild(b); }

document.getElementById('none').onclick = () => setAll(false);
const rm = document.getElementById('rm');
rm.onchange = () => { settings.reduceMotion = rm.checked ? true : null; };
canvas.addEventListener('pointerup', fire);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); fire(); return; }
  const n = '1234567890'.indexOf(e.key);
  const on = state.on[state.cur];
  if (n >= 0 && n < on.length && !(state.cur === 'feitico' && n === 0)) { on[n] = !on[n]; drawSteps(); }
});

let W = 1, H = 1;
const wrap = document.getElementById('wrap');
function resize() { W = wrap.clientWidth; H = wrap.clientHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function simulate(dt) {
  simNow += dt; runAgenda(); runAnims();
  chestSim(dt); swordSim(dt); spellSim(dt);
}
const info = document.getElementById('info');
let last = performance.now(), statT = 0, frameMs = 0;
renderer.setAnimationLoop((tMs) => {
  const t0 = performance.now();
  const dt = Math.min((tMs - last) / 1000, 0.25); last = tMs;
  clock.step(dt, simulate);
  updatePools(clock.frameDt); updateStars(clock.frameDt);
  shake.update(dt); floaters.update(dt); domF.sync();
  sw.bar.update(dt); sp.bar.update(dt);
  J.applyShakeToCamera(camera, camBase, shake, 0.28, 0.035);
  renderer.render(scene, camera);
  stats.push(performance.now() - t0);
  statT += dt;
  if (statT > 1) {
    statT = 0; const s = stats.summary(); let parts = 0; for (const k in P) parts += P[k].pool.count;
    info.textContent = `CPU/quadro: média ${s.mean.toFixed(2)} ms · p95 ${s.p95.toFixed(2)} ms · partículas ${parts} · draw calls ${renderer.info.render.calls}`;
  }
});
setScene('bau');
window.__lab = { fire, setScene, state, P, clock, sw, sp, chest };
