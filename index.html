<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundo 3D</title>
<style>
  :root { --bg: #9fd4f5; --pad-bg: rgba(255,255,255,.55); --pad-fg: #2b2f36; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --pad-bg: rgba(0,0,0,.35); --pad-fg: #f1f4f8; }
  }
  :root[data-theme="dark"] { --pad-bg: rgba(0,0,0,.35); --pad-fg: #f1f4f8; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .stick { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 140px; height: 140px;
           border-radius: 50%; background: var(--pad-bg); box-shadow: inset 0 0 0 2px rgba(127,127,127,.35); backdrop-filter: blur(6px);
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
             background: var(--pad-fg); opacity: .55; pointer-events: none; will-change: transform; }
  .jump:active { transform: scale(.94); }
  .jump { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px;
          border: 0; border-radius: 50%; background: var(--pad-bg); color: var(--pad-fg); font-size: 30px;
          backdrop-filter: blur(6px); user-select: none; -webkit-tap-highlight-color: transparent; }
  .hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px; border-radius: 999px; background: var(--pad-bg); backdrop-filter: blur(6px); color: var(--pad-fg); font: 800 26px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; user-select: none; }
  .hud .ico { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a0, #ffcf2b 55%, #c98e00); box-shadow: inset 0 0 0 3px #e6a800; }
  .hud.bump { animation: bump .25s; }
  .gear { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); right: 16px; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--pad-bg); color: var(--pad-fg); font-size: 22px; backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; }
  .tune { position: fixed; top: calc(126px + env(safe-area-inset-top, 0px)); right: 16px; width: 220px; max-height: calc(100% - 300px); overflow-y: auto; padding: 10px 12px; border-radius: 16px; background: var(--pad-bg); backdrop-filter: blur(8px); color: var(--pad-fg); font: 600 12px/1.2 system-ui, sans-serif; }
  .tune[hidden] { display: none; }
  .tune label { display: block; margin-bottom: 8px; }
  .tune .r { display: flex; justify-content: space-between; }
  .tune input { width: 100%; margin: 4px 0 0; }
  .tune button { width: 100%; border: 0; border-radius: 10px; padding: 6px; background: rgba(127,127,127,.25); color: inherit; font-size: 16px; }
  .edit { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 16px; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--pad-bg); color: var(--pad-fg); font-size: 22px; backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; }
  .edit.on { background: #ffd23f; color: #222; }
  .run { position: fixed; left: 24px; bottom: calc(98px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--pad-bg); color: var(--pad-fg); font-size: 26px; backdrop-filter: blur(6px); user-select: none; -webkit-tap-highlight-color: transparent; }
  .run:active { transform: scale(.94); }
  body.editing .stick, body.editing .jump, body.editing .run { display: none; }
  .tools { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 96vw; }
  .tools[hidden], .tools .row[hidden] { display: none; }
  .tools .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; border-radius: 16px; background: var(--pad-bg); backdrop-filter: blur(8px); }
  .tools button { min-width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(127,127,127,.25); color: var(--pad-fg); font-size: 20px; padding: 0 8px; }
  .tools button.on { background: #ffd23f; color: #222; }
  .tools button[hidden] { display: none; }
  #out { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 90vw); height: 40%; z-index: 5; font: 12px/1.3 ui-monospace, monospace; background: Canvas; color: CanvasText; border-radius: 12px; padding: 10px; }
  @keyframes bump { 50% { transform: scale(1.22); } }
  .reset { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--pad-bg); color: var(--pad-fg); font-size: 24px; backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; }
  .reset:active { transform: scale(.92); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="jump" data-k=" ">⤒</button>
<div class="hud" id="hud"><span class="ico"></span><span id="n">0</span></div>
<button class="reset" id="reset">↻</button>
<button class="gear" id="gear">⚙</button>
<div class="tune" id="tune" hidden></div>
<button class="run" data-k="Shift">»</button>
<button class="edit" id="edit">✎</button>
<div class="tools" id="tools" hidden></div>
<textarea id="out" hidden readonly></textarea>
<div class="stick" id="stick"><i></i></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const T = THREE;
  const canvas = document.getElementById('c');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(50, 1, 0.1, 300);

  // ---------- helpers ----------
  function canvasTex(w, h, draw, rx, ry) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new T.CanvasTexture(c);
    t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = 4;
    return t;
  }
  const mat = (c, r) => new T.MeshStandardMaterial({ color: c, roughness: r == null ? 0.7 : r });
  function mesh(geo, m, x, y, z, parent) {
    const o = new T.Mesh(geo, m); o.position.set(x || 0, y || 0, z || 0);
    o.castShadow = true; o.receiveShadow = true; (parent || scene).add(o); return o;
  }

  // ---------- ceu, luz, neblina ----------
  scene.background = canvasTex(4, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#4aa6ee'); gr.addColorStop(0.55, '#a8d8f5'); gr.addColorStop(1, '#e4f4fb');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  scene.fog = new T.Fog(0xcfeaf7, 45, 120);
  scene.add(new T.HemisphereLight(0xffffff, 0x7fbfae, 0.85));
  scene.add(new T.AmbientLight(0xffffff, 0.2));
  const sun = new T.DirectionalLight(0xfff3e0, 0.85);
  sun.position.set(12, 22, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -27, right: 27, top: 27, bottom: -27, near: 1, far: 80 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  // ---------- texturas ----------
  const grassTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#38bd88'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(25,140,105,.35)' : 'rgba(130,235,175,.30)';
      g.fillRect(Math.random() * w, Math.random() * h, 2, 3);
    }
  }, 9, 9);
  const stripeTex = canvasTex(64, 64, (g, w, h) => {
    for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#c9d1d8' : '#e8ecef'; g.fillRect(i * 16, 0, 16, h); }
  });
  const capTex = canvasTex(8, 64, (g, w, h) => {
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#ffd23f' : '#ff9f2e'; g.fillRect(0, i * 8, w, 8); }
  });
  function grassMat(w, d) {
    const t = grassTex.clone(); t.needsUpdate = true; t.repeat.set(w / 4, d / 4);
    return new T.MeshStandardMaterial({ map: t, roughness: 0.95 });
  }
  function stripeMat(len) {
    const t = stripeTex.clone(); t.needsUpdate = true; t.repeat.set(len / 3.6, 1);
    return new T.MeshStandardMaterial({ map: t, roughness: 0.8 });
  }
  const orange = mat(0xe9a23b, 0.8);

  // ---------- oceano ----------
  const ocean = new T.Mesh(new T.PlaneGeometry(500, 500), new T.MeshStandardMaterial({ color: 0x17c4dc, roughness: 0.35 }));
  ocean.rotation.x = -Math.PI / 2; ocean.position.y = -5; ocean.receiveShadow = true; scene.add(ocean);

  // ---------- ilha principal ----------
  const S = 36, HALF = S / 2, B = HALF - 1.3;
  mesh(new T.BoxGeometry(S, 4, S), [orange, orange, grassMat(S, S), orange, orange, orange], 0, -2, 0);

  // ilhotas distantes
  [[-32, -10, 7], [34, 14, 6], [-28, 24, 8], [30, -26, 7]].forEach(p => {
    mesh(new T.BoxGeometry(p[2], 7, p[2]), [orange, orange, grassMat(p[2], p[2]), orange, orange, orange], p[0], -4, p[1]);
  });

  // grade branca nas bordas
  const railMat = mat(0xeeebe4, 0.6), E = HALF - 0.7;
  [[0, -E, 2 * E, 0.12], [0, E, 2 * E, 0.12]].forEach(r => mesh(new T.BoxGeometry(r[2], r[3], 0.12), railMat, r[0], 1.05, r[1]));
  [-E, E].forEach(x => mesh(new T.BoxGeometry(0.12, 0.12, 2 * E), railMat, x, 1.05, 0));
  for (let i = -E; i <= E + 0.01; i += 2.88) {
    [-E, E].forEach(e => {
      mesh(new T.BoxGeometry(0.14, 1.1, 0.14), railMat, i, 0.55, e);
      mesh(new T.BoxGeometry(0.14, 1.1, 0.14), railMat, e, 0.55, i);
    });
  }

  // ---------- plataformas (com colisao) ----------
  const boxes = [], coins = [], items = [];
  const raw = { platform: platformRaw, tree: treeRaw, bush: bushRaw, flower: flowerRaw, coin: coinRaw };
  function spawn(type, args) {
    const n0 = scene.children.length, b0 = boxes.length, c0 = coins.length;
    raw[type](...args);
    const it = { type, args, objs: scene.children.slice(n0), boxes: boxes.slice(b0), coins: coins.slice(c0) };
    items.push(it); return it;
  }
  function despawn(it) {
    it.objs.forEach(o => {
      scene.remove(o);
      o.traverse(n => {
        if (n.geometry && n.geometry !== coinGeo) n.geometry.dispose();
        if (it.type === 'platform' && n.material) [].concat(n.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
      });
    });
    it.boxes.forEach(b => boxes.splice(boxes.indexOf(b), 1));
    it.coins.forEach(c => coins.splice(coins.indexOf(c), 1));
    items.splice(items.indexOf(it), 1);
  }
  function platform(...a) { spawn('platform', a); }
  function platformRaw(cx, cz, w, d, top) {
    const sx = stripeMat(d), sz = stripeMat(w);
    mesh(new T.BoxGeometry(w, top, d), [sx, sx, grassMat(w, d), orange, sz, sz], cx, top / 2, cz);
    boxes.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, top });
  }
  platform(6, -6, 6, 6, 1.2);
  platform(10, -10, 6, 6, 2.4);
  platform(14, -14, 6, 6, 3.6);
  platform(-9, -5, 5, 5, 1.2);
  platform(-13, -9, 5, 5, 2.4);
  platform(-2, -13, 4, 4, 1.2);

  // ---------- enfeites ----------
  function tree(...a) { spawn('tree', a); }
  function treeRaw(x, z, s) {
    const g = new T.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
    mesh(new T.CylinderGeometry(0.35, 0.5, 3, 14), mat(0xf4ead9), 0, 1.5, 0, g);
    const cap = mesh(new T.SphereGeometry(1.7, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.6),
      new T.MeshStandardMaterial({ map: capTex, roughness: 0.9, side: T.DoubleSide }), 0, 3.1, 0, g);
    cap.scale.y = 1.1;
    boxes.push({ x0: x - 0.5 * s, x1: x + 0.5 * s, z0: z - 0.5 * s, z1: z + 0.5 * s, top: 99 });
  }
  tree(-5, -11, 1); tree(12, 8, 0.8); tree(-13, 10, 0.9);

  const bushMat = mat(0x1f9a63, 0.9);
  function bush(...a) { spawn('bush', a); }
  function bushRaw(x, z, s) {
    [[0, 0, 0.8], [0.7, 0.1, 0.6], [-0.6, 0.2, 0.55]].forEach(p =>
      mesh(new T.SphereGeometry(p[2] * s, 14, 10), bushMat, x + p[0] * s, p[2] * s * 0.8, z + p[1] * s));
  }
  bush(-14.5, -2, 1); bush(-14.5, 4, 1.2); bush(7, 13.5, 1); bush(15, 2, 0.9); bush(0, -16, 1);

  const petalMat = mat(0xf4a7e6, 0.6), centerMat = mat(0xffd23f, 0.5), stemMat = mat(0x1f9a63, 0.8);
  function flower(...a) { spawn('flower', a); }
  function flowerRaw(x, z) {
    const g = new T.Group(); g.position.set(x, 0, z); scene.add(g);
    mesh(new T.CylinderGeometry(0.025, 0.025, 0.35, 6), stemMat, 0, 0.17, 0, g);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      const p = mesh(new T.SphereGeometry(0.1, 8, 6), petalMat, Math.cos(a) * 0.13, 0.38, Math.sin(a) * 0.13, g);
      p.scale.y = 0.45;
    }
    mesh(new T.SphereGeometry(0.07, 8, 6), centerMat, 0, 0.4, 0, g);
  }
  [[10, 6], [-10, 9], [1, 13], [-6, 0], [15, -2]].forEach(c => {
    for (let i = 0; i < 6; i++) flower(c[0] + (Math.random() - 0.5) * 3, c[1] + (Math.random() - 0.5) * 3);
  });

  const clouds = [];
  function cloud(x, y, z, s) {
    const g = new T.Group(); g.position.set(x, y, z); g.scale.setScalar(s);
    const m = new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0x9aa7b3, roughness: 1 });
    [[0, 0, 2], [2, -0.3, 1.6], [-2, -0.2, 1.5], [0.8, 0.9, 1.4]].forEach(p => {
      const o = new T.Mesh(new T.SphereGeometry(p[2], 14, 10), m); o.position.set(p[0], p[1], 0); g.add(o);
    });
    scene.add(g); clouds.push(g);
  }
  [[-40, 18, -35, 2], [20, 22, -50, 2.5], [45, 16, -10, 1.8], [-55, 20, 10, 2.2], [5, 26, -70, 3], [-20, 15, 40, 1.8]]
    .forEach(c => cloud(c[0], c[1], c[2], c[3]));

  // ---------- moedas ----------
  const coinGeo = new T.CylinderGeometry(0.35, 0.35, 0.07, 22);
  const coinMat = new T.MeshStandardMaterial({ color: 0xffcf2b, emissive: 0x6b4a00, metalness: 0.5, roughness: 0.3 });
  
  [[-2, 6, 0.9], [0, 4, 0.9], [2, 2, 0.9], [4, 0, 0.9], [-4, 3, 0.9], [8, 4, 0.9], [-8, 8, 0.9],
   [6, -6, 2.1], [10, -10, 3.3], [14, -14, 4.5], [-9, -5, 2.1], [-13, -9, 3.3], [-2, -13, 2.1], [0, -6, 0.9]]
    .forEach(c => {
      const g = new T.Group(); g.position.set(c[0], c[2], c[1]);
      const m = new T.Mesh(coinGeo, coinMat); m.rotation.x = Math.PI / 2; m.castShadow = true; g.add(m);
      scene.add(g); coins.push({ g, t: -1, by: c[2], vy: 0 });
    });

  function coinRaw(x, z, y) {
    const g = new T.Group(); g.position.set(x, y, z);
    const m = new T.Mesh(coinGeo, coinMat); m.rotation.x = Math.PI / 2; m.castShadow = true; g.add(m);
    scene.add(g); coins.push({ g, t: -1, by: y, vy: 0 });
  }
  coins.forEach(c => items.push({ type: 'coin', args: [c.g.position.x, c.g.position.z, c.by], objs: [c.g], boxes: [], coins: [c] }));

  // ---------- particulas ----------
  const starShape = new T.Shape();
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.09 : 0.2;
    if (i) starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r); else starShape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const starGeo = new T.ShapeGeometry(starShape);
  const starMats = [0xffd93b, 0xffffff, 0xffa927].map(c => new T.MeshBasicMaterial({ color: c, side: T.DoubleSide, fog: false }));
  const stars = [];
  for (let i = 0; i < 90; i++) {
    const m = new T.Mesh(starGeo, starMats[i % 3]); m.visible = false; scene.add(m);
    stars.push({ m, v: new T.Vector3(), life: 0, max: 1, spin: 0, rot: 0 });
  }
  let starI = 0;
  function burst(x, y, z, n) {
    for (let i = 0; i < n; i++) {
      const s = stars[starI++ % stars.length];
      const a = Math.random() * Math.PI * 2, u = Math.random() * 0.8 + 0.2, sp = 3 + Math.random() * 4;
      s.v.set(Math.cos(a) * sp * u, 2 + Math.random() * 5, Math.sin(a) * sp * u);
      s.m.position.set(x, y, z); s.life = s.max = 0.55 + Math.random() * 0.4;
      s.spin = (Math.random() - 0.5) * 14; s.rot = Math.random() * 6; s.m.visible = true;
    }
  }
  const dust = [];
  for (let i = 0; i < 24; i++) {
    const m = new T.Mesh(new T.SphereGeometry(0.16, 8, 6), new T.MeshBasicMaterial({ color: 0xf6f1e6, transparent: true, opacity: 0 }));
    m.visible = false; scene.add(m); dust.push({ m, life: 0, max: 1, v: new T.Vector3() });
  }
  let dustI = 0;
  function puff(x, z, vx, vz) {
    const d = dust[dustI++ % dust.length];
    d.m.position.set(x, 0.15, z);
    d.v.set(vx * 0.15 + (Math.random() - 0.5), 0.6 + Math.random(), vz * 0.15 + (Math.random() - 0.5));
    d.life = d.max = 0.45; d.m.visible = true;
  }
  function updateFx(dt) {
    stars.forEach(s => {
      if (s.life <= 0) return;
      s.life -= dt;
      if (s.life <= 0) { s.m.visible = false; return; }
      s.v.y -= 14 * dt; s.m.position.addScaledVector(s.v, dt);
      s.m.quaternion.copy(camera.quaternion); s.rot += s.spin * dt; s.m.rotateZ(s.rot);
      s.m.scale.setScalar(Math.min(1, s.life / s.max * 1.6));
    });
    dust.forEach(d => {
      if (d.life <= 0) return;
      d.life -= dt;
      if (d.life <= 0) { d.m.visible = false; return; }
      const k = d.life / d.max;
      d.m.position.addScaledVector(d.v, dt); d.m.scale.setScalar(1.6 - k); d.m.material.opacity = k * 0.7;
    });
  }

  // ---------- personagem (original, inspirado em encanador de macacao) ----------
  const skin = mat(0xffc9a0, 0.6), red = mat(0xe02424, 0.55), blue = mat(0x2a58d6, 0.6),
        white = mat(0xffffff, 0.5), brown = mat(0x5a3b24, 0.8), dark = mat(0x1b1b2a, 0.4), gold = mat(0xffd23f, 0.3);
  const hero = new T.Group(), model = new T.Group();
  hero.add(model); scene.add(hero);
  function limb(x, y, parts) {
    const g = new T.Group(); g.position.set(x, y, 0); model.add(g);
    parts.forEach(p => mesh(p[0], p[1], p[2], p[3], p[4], g)); return g;
  }
  const legP = limb(0.16, 0.5, [[new T.CylinderGeometry(0.13, 0.12, 0.4, 12), blue, 0, -0.22, 0], [new T.BoxGeometry(0.26, 0.14, 0.38), brown, 0, -0.45, 0.06]]);
  const legN = limb(-0.16, 0.5, [[new T.CylinderGeometry(0.13, 0.12, 0.4, 12), blue, 0, -0.22, 0], [new T.BoxGeometry(0.26, 0.14, 0.38), brown, 0, -0.45, 0.06]]);
  const armP = limb(0.38, 1.12, [[new T.CylinderGeometry(0.1, 0.09, 0.3, 10), red, 0, -0.15, 0], [new T.SphereGeometry(0.12, 12, 8), white, 0, -0.36, 0]]);
  const armN = limb(-0.38, 1.12, [[new T.CylinderGeometry(0.1, 0.09, 0.3, 10), red, 0, -0.15, 0], [new T.SphereGeometry(0.12, 12, 8), white, 0, -0.36, 0]]);
  mesh(new T.SphereGeometry(0.34, 18, 12), blue, 0, 0.75, 0, model).scale.set(1, 0.9, 0.85);
  mesh(new T.SphereGeometry(0.33, 18, 12), red, 0, 1.05, 0, model).scale.set(1, 0.7, 0.8);
  [-0.14, 0.14].forEach(x => {
    mesh(new T.BoxGeometry(0.08, 0.34, 0.06), blue, x, 1.02, 0.2, model);
    mesh(new T.SphereGeometry(0.04, 8, 6), gold, x, 0.9, 0.28, model);
  });
  const head = new T.Group(); head.position.y = 1.5; model.add(head);
  mesh(new T.SphereGeometry(0.3, 20, 14), skin, 0, 0, 0, head).scale.set(1, 0.95, 1);
  mesh(new T.SphereGeometry(0.09, 10, 8), skin, 0, -0.04, 0.3, head);
  [-0.1, 0.1].forEach(x => mesh(new T.SphereGeometry(0.045, 8, 6), dark, x, 0.07, 0.26, head));
  [-0.28, 0.28].forEach(x => mesh(new T.SphereGeometry(0.09, 8, 6), brown, x, -0.02, -0.04, head));
  mesh(new T.SphereGeometry(0.33, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), red, 0, 0.05, 0, head);
  mesh(new T.BoxGeometry(0.46, 0.05, 0.3), red, 0, 0.1, 0.3, head);

  // silhueta quando o boneco fica atras de objetos
  const silMat = new T.MeshBasicMaterial({ color: 0x5d73ff, transparent: true, opacity: 0.55, depthFunc: T.GreaterDepth, depthWrite: false, fog: false });
  silMat.visible = false;
  const silMats = [silMat], heroMeshes = [];
  hero.traverse(o => { if (o.isMesh) heroMeshes.push(o); });
  heroMeshes.forEach(o => { const s = new T.Mesh(o.geometry, silMat); s.renderOrder = 2; s.castShadow = false; s.receiveShadow = false; o.add(s); });
  const occRay = new T.Raycaster(), occFrom = new T.Vector3(), occTo = new T.Vector3(), occDir = new T.Vector3();
  let occN = 0;
  function occTick(p) {
    if (++occN % 3) return;
    occFrom.copy(camera.position); occTo.set(p.x, p.y + 0.8, p.z);
    occDir.subVectors(occTo, occFrom);
    const dist = occDir.length(); occDir.normalize();
    occRay.set(occFrom, occDir); occRay.far = dist - 0.4;
    const list = [];
    items.forEach(it => { if (it.type === 'platform' || it.type === 'tree' || it.type === 'bush') list.push(...it.objs); });
    const vis = occRay.intersectObjects(list, true).length > 0;
    silMats.forEach(m => { m.visible = vis; });
  }
  hero.position.set(0, 0, 8);

  // ---------- entrada ----------
  const keys = {}, used = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Shift'];
  window.addEventListener('keydown', e => { if (used.includes(e.key)) { keys[e.key] = true; e.preventDefault(); } });
  window.addEventListener('keyup', e => { if (used.includes(e.key)) keys[e.key] = false; });
  window.addEventListener('blur', () => used.forEach(k => keys[k] = false));
  document.querySelectorAll('.jump, .run').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  });

  // stick analogico virtual: direcao + intensidade (0 a 1, com zona morta)
  const stick = { dx: 0, dz: 0, m: 0 };
  const stickEl = document.getElementById('stick'), knob = stickEl.firstElementChild;
  let stickId = null;
  function stickReset() { stickId = null; stick.dx = stick.dz = stick.m = 0; knob.style.transform = ''; }
  function stickMove(e) {
    const r = stickEl.getBoundingClientRect(), half = r.width / 2;
    const x = e.clientX - (r.left + half), y = e.clientY - (r.top + half);
    const d = Math.hypot(x, y), lim = half - 22, k = d > lim ? lim / d : 1, DZ = 0.15;
    knob.style.transform = 'translate(' + (x * k) + 'px,' + (y * k) + 'px)';
    const m = Math.min(d / lim, 1);
    if (m < DZ) { stick.dx = stick.dz = stick.m = 0; }
    else { stick.m = (m - DZ) / (1 - DZ); stick.dx = x / d; stick.dz = y / d; }
  }
  stickEl.addEventListener('pointerdown', e => {
    if (stickId !== null) return;
    e.preventDefault(); stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId); stickMove(e);
  });
  stickEl.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
  const stickEnd = e => { if (e.pointerId === stickId) stickReset(); };
  stickEl.addEventListener('pointerup', stickEnd); stickEl.addEventListener('pointercancel', stickEnd);
  window.addEventListener('blur', stickReset);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  // ---------- loop ----------
  let SPEED = 8.5, ACCEL = 12, FRICTION = 15, BRAKE = 26, JUMP = 9.5, GRAVITY = 28, WALK = 5;
  const R = 0.4;
  const vel = new T.Vector3(), dir = new T.Vector3(), look = new T.Vector3(), camT = new T.Vector3();
  let vy = 0, phase = 0, squash = 0, fast = 0, nar = 0, count = 0, puffT = 0, air = false, skid = false;
  const clock = new T.Clock();
  const clamp = T.MathUtils.clamp;
  const blocked = (x, z, f) => boxes.some(b => f < b.top - 0.05 && x > b.x0 - R && x < b.x1 + R && z > b.z0 - R && z < b.z1 + R);
  const ease = (o, k, dt, t) => { o.rotation[k] += (t - o.rotation[k]) * (1 - Math.exp(-18 * dt)); };
  camera.position.set(0, 9, 20);

  const hudEl = document.getElementById('hud'), numEl = document.getElementById('n');
  function bumpHud() {
    numEl.textContent = count;
    hudEl.classList.remove('bump'); void hudEl.offsetWidth; hudEl.classList.add('bump');
  }
  function reset() {
    hero.position.set(0, 0, 8); hero.rotation.set(0, 0, 0);
    vel.set(0, 0, 0); vy = 0; squash = 0; fast = 0; nar = 0; count = 0; air = false; skid = false;
    numEl.textContent = 0;
    coins.forEach(c => { c.t = -1; c.vy = 0; c.g.visible = true; c.g.scale.setScalar(1); c.g.position.y = c.by; });
    stars.forEach(s => { s.life = 0; s.m.visible = false; });
    dust.forEach(d => { d.life = 0; d.m.visible = false; });
    camera.position.set(0, 9, 20);
  }
  document.getElementById('reset').addEventListener('click', e => { reset(); e.currentTarget.blur(); });
  window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reset(); });

  // painel de ajuste (somente para testes)
  const tuneEl = document.getElementById('tune'), gearEl = document.getElementById('gear');
  gearEl.addEventListener('click', e => { tuneEl.hidden = !tuneEl.hidden; e.currentTarget.blur(); });
  const params = [
    ['SPEED', 3, 14, 0.1, () => SPEED, v => { SPEED = v; }],
    ['ACCEL', 3, 40, 0.5, () => ACCEL, v => { ACCEL = v; }],
    ['FRICTION', 3, 40, 0.5, () => FRICTION, v => { FRICTION = v; }],
    ['BRAKE', 5, 60, 0.5, () => BRAKE, v => { BRAKE = v; }],
    ['JUMP', 5, 16, 0.1, () => JUMP, v => { JUMP = v; }],
    ['GRAVITY', 10, 50, 0.5, () => GRAVITY, v => { GRAVITY = v; }],
    ['WALK', 2, 10, 0.1, () => WALK, v => { WALK = v; }]
  ];
  const defs = params.map(p => p[4]()), sync = [];
  params.forEach(p => {
    const row = document.createElement('label'), top = document.createElement('div'),
          nm = document.createElement('span'), vl = document.createElement('b'), inp = document.createElement('input');
    top.className = 'r'; nm.textContent = p[0]; top.append(nm, vl);
    inp.type = 'range'; inp.min = p[1]; inp.max = p[2]; inp.step = p[3];
    const show = () => { inp.value = p[4](); vl.textContent = String(Math.round(p[4]() * 100) / 100); };
    show(); sync.push(show);
    inp.addEventListener('input', () => { p[5](parseFloat(inp.value)); show(); });
    inp.addEventListener('change', () => inp.blur());
    row.append(top, inp); tuneEl.append(row);
  });
  const rst = document.createElement('button'); rst.textContent = '↺';
  rst.addEventListener('click', () => { params.forEach((p, i) => p[5](defs[i])); sync.forEach(f => f()); rst.blur(); });
  tuneEl.append(rst);

  // ---------- modo de edicao ----------
  const LEVEL = null; // para fixar uma fase: troque null pelo texto exportado (sem o const LEVEL =)
  let editing = false, tool = 'sel', sel = null, drag = null;
  const rc = new T.Raycaster(), ndc = new T.Vector2(), editCam = new T.Vector3(0, 46, 16);
  const selBox = new T.Mesh(new T.BoxGeometry(1, 1, 1), new T.MeshBasicMaterial({ color: 0xffe14d, wireframe: true, fog: false }));
  selBox.visible = false; scene.add(selBox);
  const snap = (v, s) => Math.round(v / s) * s, lim = HALF - 1;
  const toolsEl = document.getElementById('tools'), editBtn = document.getElementById('edit'), outEl = document.getElementById('out');

  function bounds(it) {
    const a = it.args;
    if (it.type === 'platform') return { x: a[0], z: a[1], y: a[4] / 2, sx: a[2], sy: a[4], sz: a[3], py: a[4] };
    if (it.type === 'tree') return { x: a[0], z: a[1], y: 2.1 * a[2], sx: 3.4 * a[2], sy: 4.2 * a[2], sz: 3.4 * a[2], py: 2.1 * a[2] };
    if (it.type === 'bush') return { x: a[0], z: a[1], y: 0.6 * a[2], sx: 2.2 * a[2], sy: 1.2 * a[2], sz: 1.8 * a[2], py: 0.6 * a[2] };
    if (it.type === 'flower') return { x: a[0], z: a[1], y: 0.3, sx: 0.6, sy: 0.6, sz: 0.6, py: 0.3 };
    return { x: a[0], z: a[1], y: a[2], sx: 1, sy: 1, sz: 1, py: a[2] };
  }
  function updateSel() {
    selBox.visible = !!sel;
    if (!sel) return;
    const b = bounds(sel);
    selBox.position.set(b.x, b.y, b.z); selBox.scale.set(b.sx + 0.2, b.sy + 0.2, b.sz + 0.2);
  }
  function planeHit(y) {
    const r = rc.ray;
    if (Math.abs(r.direction.y) < 1e-4) return null;
    const t = (y - r.origin.y) / r.direction.y;
    return t < 0 ? null : r.origin.clone().addScaledVector(r.direction, t);
  }
  function pick() {
    let best = null, bd = Infinity;
    items.forEach(it => {
      const b = bounds(it), p = planeHit(b.py);
      if (p && Math.abs(p.x - b.x) <= b.sx / 2 && Math.abs(p.z - b.z) <= b.sz / 2) {
        const d = p.distanceTo(rc.ray.origin);
        if (d < bd) { bd = d; best = it; }
      }
    });
    return best;
  }
  function topAt(x, z) {
    let t = 0;
    items.forEach(it => { if (it.type === 'platform') { const a = it.args; if (Math.abs(x - a[0]) <= a[2] / 2 && Math.abs(z - a[1]) <= a[3] / 2) t = Math.max(t, a[4]); } });
    return t;
  }
  function saveLevel() { try { localStorage.setItem('fase3d', JSON.stringify(items.map(i => [i.type, i.args]))); } catch (e) {} }
  function loadLevel(list) { items.slice().forEach(despawn); list.forEach(l => spawn(l[0], l[1].slice())); }
  function respawn(a) { const t = sel.type; despawn(sel); sel = spawn(t, a); updateSel(); }
  const DEFAULT = items.map(i => [i.type, i.args.slice()]);
  try { const s = LEVEL || JSON.parse(localStorage.getItem('fase3d') || 'null'); if (s) loadLevel(s); } catch (e) {}

  function act(k, dir) {
    if (!sel) return;
    const a = sel.args.slice(), t = sel.type;
    if (k === 'del') { despawn(sel); sel = null; updateSel(); refreshActions(); saveLevel(); return; }
    if (k === 'h') { if (t === 'platform') a[4] = clamp(+(a[4] + 0.6 * dir).toFixed(2), 0.6, 7.2); else a[2] = clamp(+(a[2] + 0.3 * dir).toFixed(2), 0.5, 9); }
    if (k === 'w') a[2] = clamp(a[2] + dir, 2, 14);
    if (k === 'd') a[3] = clamp(a[3] + dir, 2, 14);
    if (k === 's') a[2] = clamp(+(a[2] + 0.2 * dir).toFixed(2), 0.4, 3);
    respawn(a); saveLevel();
  }

  // interface
  const arow = document.createElement('div'), trow = document.createElement('div');
  arow.className = trow.className = 'row'; arow.hidden = true; toolsEl.append(arow, trow);
  const toolBtns = {}, actBtns = [];
  function mk(label, parent, fn) { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', () => { fn(); b.blur(); }); parent.append(b); return b; }
  [['sel', '✥'], ['platform', '▭'], ['tree', '🌳'], ['bush', '🌿'], ['flower', '🌼'], ['coin', '🪙']].forEach(t => {
    toolBtns[t[0]] = mk(t[1], trow, () => { tool = t[0]; Object.keys(toolBtns).forEach(k => toolBtns[k].classList.toggle('on', k === tool)); });
  });
  toolBtns.sel.classList.add('on');
  mk('⤓', trow, () => {
    const txt = 'const LEVEL = ' + JSON.stringify(items.map(i => [i.type, i.args.map(v => +(+v).toFixed(2))])) + ';';
    try { navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
    outEl.value = txt; outEl.hidden = !outEl.hidden; if (!outEl.hidden) outEl.select();
  });
  mk('⟲', trow, () => { loadLevel(DEFAULT); sel = null; updateSel(); refreshActions(); try { localStorage.removeItem('fase3d'); } catch (e) {} });
  mk('▶', trow, () => setEdit(false));
  [['⬆', 'h', 1, 'platform coin'], ['⬇', 'h', -1, 'platform coin'], ['↔+', 'w', 1, 'platform'], ['↔−', 'w', -1, 'platform'],
   ['↕+', 'd', 1, 'platform'], ['↕−', 'd', -1, 'platform'], ['⊕', 's', 1, 'tree bush'], ['⊖', 's', -1, 'tree bush'],
   ['🗑', 'del', 0, 'platform tree bush flower coin']].forEach(d => {
    const b = mk(d[0], arow, () => act(d[1], d[2])); b.dataset.for = d[3]; actBtns.push(b);
  });
  function refreshActions() {
    arow.hidden = !sel;
    actBtns.forEach(b => { b.hidden = !(sel && b.dataset.for.split(' ').includes(sel.type)); });
  }
  function setEdit(on) {
    editing = on; document.body.classList.toggle('editing', on); silMats.forEach(m => { m.visible = false; }); toolsEl.hidden = !on; editBtn.classList.toggle('on', on);
    used.forEach(k => { keys[k] = false; }); stickReset();
    if (on) { tuneEl.hidden = true; } else { sel = null; drag = null; updateSel(); refreshActions(); outEl.hidden = true; reset(); }
  }
  editBtn.addEventListener('click', e => { setEdit(!editing); e.currentTarget.blur(); });
  window.addEventListener('keydown', e => {
    if (!editing) return;
    if (e.key === 'Delete' || e.key === 'Backspace') act('del', 0);
    if (e.key === 'Escape') outEl.hidden = true;
  });

  function setRay(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    rc.setFromCamera(ndc, camera);
  }
  canvas.addEventListener('pointerdown', e => {
    if (!editing) return;
    setRay(e);
    if (tool === 'sel') {
      sel = pick(); updateSel(); refreshActions();
      if (sel) { const b = bounds(sel), p = planeHit(b.py); drag = { dx: p ? p.x - b.x : 0, dz: p ? p.z - b.z : 0, py: b.py }; canvas.setPointerCapture(e.pointerId); }
    } else {
      const p = planeHit(0); if (!p) return;
      const x = clamp(snap(p.x, 1), -lim, lim), z = clamp(snap(p.z, 1), -lim, lim);
      const defs = { platform: [x, z, 4, 4, 1.2], tree: [x, z, 1], bush: [x, z, 1], flower: [x, z], coin: [x, z, topAt(x, z) + 0.9] };
      sel = spawn(tool, defs[tool]); updateSel(); refreshActions();
      drag = { dx: 0, dz: 0, py: bounds(sel).py }; canvas.setPointerCapture(e.pointerId);
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!editing || !drag || !sel) return;
    setRay(e);
    const p = planeHit(drag.py); if (!p) return;
    const x = clamp(snap(p.x - drag.dx, 1), -lim, lim), z = clamp(snap(p.z - drag.dz, 1), -lim, lim);
    if (x === sel.args[0] && z === sel.args[1]) return;
    const a = sel.args.slice(); a[0] = x; a[1] = z; respawn(a);
  });
  const endDrag = () => { if (drag) { drag = null; saveLevel(); } };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

  function editStep(dt) {
    camera.position.lerp(editCam, 1 - Math.exp(-5 * dt)); camera.lookAt(0, 0, 0);
    coins.forEach(c => { if (c.t < 0) c.g.rotation.y += dt * 3; });
    clouds.forEach(c => { c.position.x += dt * 0.6; if (c.position.x > 70) c.position.x = -70; });
    updateFx(dt);
  }

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
    if (editing) { editStep(dt); renderer.render(scene, camera); requestAnimationFrame(tick); return; }
    dir.set((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), 0, (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0));
    let mag = 1;
    if (dir.lengthSq() > 0) dir.normalize();
    else if (stick.m > 0) { dir.set(stick.dx, 0, stick.dz); mag = stick.m; }
    const hasIn = dir.lengthSq() > 0;
    const sp0 = Math.hypot(vel.x, vel.z);
    const opposing = hasIn && sp0 > 0.5 && (vel.x * dir.x + vel.z * dir.z) < -0.2 * sp0;
    skid = opposing && !air && sp0 > 3;
    const rate = (!hasIn ? FRICTION : opposing ? BRAKE : ACCEL) * (air ? 0.6 : 1);
    dir.multiplyScalar((keys.Shift ? SPEED : WALK) * mag);
    const dx = dir.x - vel.x, dz = dir.z - vel.z, dl = Math.hypot(dx, dz), step = rate * dt;
    if (dl <= step) { vel.x = dir.x; vel.z = dir.z; } else { vel.x += dx / dl * step; vel.z += dz / dl * step; }

    // movimento horizontal com colisao
    const p = hero.position, feet = p.y;
    const nx = clamp(p.x + vel.x * dt, -B, B);
    if (!blocked(nx, p.z, feet)) p.x = nx;
    const nz = clamp(p.z + vel.z * dt, -B, B);
    if (!blocked(p.x, nz, feet)) p.z = nz;

    // chao sob os pes
    let ground = 0;
    boxes.forEach(b => {
      if (feet >= b.top - 0.15 && p.x > b.x0 - 0.15 && p.x < b.x1 + 0.15 && p.z > b.z0 - 0.15 && p.z < b.z1 + 0.15) ground = Math.max(ground, b.top);
    });

    // pulo e gravidade
    if (keys[' '] && feet <= ground + 0.001 && vy <= 0) vy = JUMP;
    vy -= GRAVITY * dt;
    let ny = feet + vy * dt;
    if (ny <= ground && vy <= 0) { if (vy < -6) { squash = 0.2; puff(p.x - 0.3, p.z, 0, 0); puff(p.x + 0.3, p.z, 0, 0); } ny = ground; vy = 0; }
    p.y = ny;
    const grounded = ny <= ground + 0.001;
    air = !grounded;

    // direcao do corpo
    const speed = Math.hypot(vel.x, vel.z), ratio = clamp(speed / SPEED, 0, 1);
    if (speed > 0.3) {
      let d = Math.atan2(vel.x, vel.z) - hero.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      hero.rotation.y += d * (1 - Math.exp(-14 * dt));
    }

    // corrida maxima (pose ninja) e derrapagem
    const sprint = keys.Shift && grounded && !skid && dir.lengthSq() > 0;
    nar += ((sprint ? 1 : 0) - nar) * (1 - Math.exp(-14 * dt));
    if (skid) { puffT -= dt; if (puffT <= 0) { puffT = 0.04; puff(p.x, p.z, vel.x, vel.z); } }
    // animacoes
    let lP, lN, aP, aN, lean = 0;
    if (!grounded) {
      if (vy > 0) { aP = aN = -2.7; lP = -0.9; lN = 0.45; lean = -0.05; }
      else { aP = aN = -1.7; lP = -0.35; lN = 0.35; lean = 0.08; }
    } else if (skid) {
      aP = aN = -1.1; lP = 0.5; lN = -0.5; lean = -0.38;
    } else if (ratio > 0.1) {
      phase += dt * (6 + 8 * ratio + 5 * nar);
      const s = Math.sin(phase);
      lP = s * ratio * (1 + 0.3 * nar); lN = -lP; aP = -s * 0.9 * ratio; aN = -aP; lean = 0.18 * ratio;
      aP += (1.4 - aP) * nar; aN += (1.4 - aN) * nar; lean += (0.55 - lean) * nar;
    } else {
      const br = Math.sin(time * 2) * 0.05; lP = lN = 0; aP = br; aN = -br;
    }
    ease(legP, 'x', dt, lP); ease(legN, 'x', dt, lN); ease(armP, 'x', dt, aP); ease(armN, 'x', dt, aN);
    armP.rotation.z = 0.15 * (1 - nar); armN.rotation.z = -0.15 * (1 - nar);
    ease(model, 'x', dt, lean); ease(head, 'x', dt, -lean * 0.7);
    squash = Math.max(0, squash - dt * 0.9);
    model.scale.set(1 + squash * 0.6, 1 - squash, 1 + squash * 0.6);

    // moedas
    coins.forEach(c => {
      if (c.t < 0) {
        c.g.rotation.y += dt * 3;
        if (Math.hypot(c.g.position.x - p.x, c.g.position.z - p.z) < 0.9 && Math.abs(c.g.position.y - (p.y + 0.7)) < 1) { c.t = 0; c.vy = 7; count++; bumpHud(); }
      } else if (c.t < 0.42) {
        c.t += dt; c.vy -= 22 * dt; c.g.rotation.y += dt * 18; c.g.position.y += c.vy * dt;
        c.g.scale.setScalar(1 + 0.35 * Math.sin(Math.min(c.t / 0.42, 1) * Math.PI));
        if (c.t >= 0.42) { c.g.visible = false; burst(c.g.position.x, c.g.position.y, c.g.position.z, 16); c.t = 1; }
      }
    });
    clouds.forEach(c => { c.position.x += dt * 0.6; if (c.position.x > 70) c.position.x = -70; });
    updateFx(dt);

    // camera
    camT.set(p.x * 0.85, p.y * 0.5 + 9, p.z * 0.85 + 12);
    camera.position.lerp(camT, 1 - Math.exp(-4 * dt));
    look.set(p.x * 0.9, p.y * 0.5 + 0.8, p.z * 0.9);
    camera.lookAt(look);
    occTick(p);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
